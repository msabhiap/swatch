<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .product-card {
      background: white;
      width: 280px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .product-image {
      height: 180px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 48px;
    }

    .product-body { padding: 20px; }

    .product-title {
      font-size: 18px;
      margin-bottom: 8px;
      color: #111827;
    }

    .product-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #4f46e5;
    }

    .buy-btn {
      background: #111827;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .buy-btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="product-card">
    <div class="product-image">🎧</div>
    <div class="product-body">
      <h3 class="product-title">Wireless Headphones</h3>
      <p class="product-desc">Premium sound with noise cancellation and 30h battery.</p>
      <div class="product-footer">
        <span class="price">$129</span>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </div>
</body>
</html>
