<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Task Manager</title>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-xl mx-auto">
    <!-- Form -->
    <form id="taskForm" class="bg-white p-4 rounded-xl shadow mb-6 space-y-3">
      <input
        id="title"
        type="text"
        placeholder="Task title"
        class="w-full px-3 py-2 border rounded-lg"
        required
      />

      <div class="flex gap-3">
        <select id="priority" class="flex-1 px-3 py-2 border rounded-lg">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <input
          id="dueDate"
          type="date"
          class="flex-1 px-3 py-2 border rounded-lg"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
      >
        Add Task
      </button>
    </form>

    <!-- Filter buttons -->
    <div id="filters" class="flex gap-2 mb-4">
      <button data-filter="all"    class="filter-btn px-3 py-1 rounded-lg">All</button>
      <button data-filter="active" class="filter-btn px-3 py-1 rounded-lg">Active</button>
      <button data-filter="done"   class="filter-btn px-3 py-1 rounded-lg">Done</button>
    </div>

    <!-- Stats -->
    <p id="stats" class="text-sm text-gray-600 mb-4"></p>

    <!-- Task list -->
    <div id="taskList" class="space-y-3"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
