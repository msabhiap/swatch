<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">📊 MyApp</div>
      <input class="search" type="text" placeholder="Search...">
      <div class="header-right">
        <span class="icon">🔔</span>
        <span class="icon">👤</span>
      </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="menu">
        <a href="#" class="menu-item active">🏠 Dashboard</a>
        <a href="#" class="menu-item">👥 Users</a>
        <a href="#" class="menu-item">📦 Orders</a>
        <a href="#" class="menu-item">⚙️ Settings</a>
        <a href="#" class="menu-item logout">🚪 Logout</a>
      </nav>
    </aside>

    <!-- STATS -->
    <section class="stats">
      <div class="stat-card">
        <h3>Users</h3>
        <p class="number">1,234</p>
      </div>
      <div class="stat-card">
        <h3>Orders</h3>
        <p class="number">567</p>
      </div>
      <div class="stat-card">
        <h3>Revenue</h3>
        <p class="number">$12K</p>
      </div>
      <div class="stat-card">
        <h3>Visitors</h3>
        <p class="number">8,910</p>
      </div>
    </section>

    <!-- CHART -->
    <section class="chart">
      <h2>📈 Sales Chart</h2>
      <div class="chart-placeholder">Chart will go here</div>
    </section>

    <!-- ACTIVITY -->
    <section class="activity">
      <h2>🔔 Recent Activity</h2>
      <ul>
        <li>User #123 signed up</li>
        <li>New order placed</li>
        <li>Payment received</li>
        <li>User #456 left review</li>
      </ul>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      © 2024 MyApp Dashboard
    </footer>

  </div>

</body>
</html>
